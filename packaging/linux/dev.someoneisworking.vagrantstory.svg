  </defs>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="url(#backdrop)"/>
  <rect x="35" y="35" width="442" height="442" rx="91" fill="none" stroke="#d9b46a" stroke-width="6" opacity=".75"/>

