    <path d="M244 96h24v240h-24Z" fill="#dfe4ea" stroke="#140404" stroke-width="8"/>
    <path d="M244 96l12-26 12 26Z" fill="#dfe4ea" stroke="#140404" stroke-width="8"/>
    <rect x="196" y="332" width="120" height="22" rx="8" fill="#d9b46a" stroke="#140404" stroke-width="8"/>
    <rect x="246" y="354" width="20" height="62" rx="6" fill="#5a2a14" stroke="#140404" stroke-width="8"/>
    <circle cx="256" cy="426" r="14" fill="#d9b46a" stroke="#140404" stroke-width="7"/>
  </g>
