<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Vagrant Story port icon</title>
  <desc id="description">A silver sword standing in a dark red rune circle.</desc>
  <defs>
